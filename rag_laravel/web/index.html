<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Laravel Docs</title>
<style>
  :root {
    --fundo: #f7f7f5; --cartao: #ffffff; --texto: #1d1d1f; --suave: #6b6b70;
    --borda: #e2e2e0; --destaque: #e0402c; --destaque-texto: #ffffff;
    --codigo: #f1f1ee; --ok: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #141416; --cartao: #1e1e21; --texto: #ececee; --suave: #9a9aa2;
      --borda: #2e2e33; --destaque: #ff5a43; --destaque-texto: #141416;
      --codigo: #26262a; --ok: #4cc38a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 16px 64px; }
  .cabeca { max-width: 760px; margin: 0 auto; text-align: center; transition: padding-top .3s ease; }
  /* Antes da primeira busca, o campo fica no meio da tela; depois sobe para dar lugar aos resultados. */
  body.inicial .cabeca { padding-top: calc(50vh - 190px); }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: var(--suave); margin: 0 0 24px; }
  form { display: grid; gap: 12px; }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
  input[type=search] {
    flex: 1 1 320px; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px;
  }
  select, button {
    padding: 10px 12px; font: inherit; color: inherit; background: var(--cartao);
    border: 1px solid var(--borda); border-radius: 10px; cursor: pointer;
  }
  button.principal { background: var(--destaque); color: var(--destaque-texto); border-color: transparent; font-weight: 600; }
  label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--suave); cursor: pointer; }
  .exemplos { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .exemplos button { font-size: 13px; padding: 4px 10px; border-radius: 999px; color: var(--suave); }
  .colunas { display: grid; gap: 16px; margin-top: 24px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .colunas.uma { max-width: 760px; margin-left: auto; margin-right: auto; }
  .coluna h2 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
  .coluna h2 span { color: var(--suave); font-weight: 400; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; }
  .topo { display: flex; gap: 8px; align-items: baseline; }
  .pos { color: var(--suave); font-variant-numeric: tabular-nums; min-width: 1.5em; }
  .caminho { font-weight: 600; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--suave); margin: 2px 0 0 calc(1.5em + 8px); overflow-wrap: anywhere; }
  .meta a { color: var(--destaque); }
  details { margin: 6px 0 0 calc(1.5em + 8px); }
  summary { font-size: 13px; color: var(--suave); cursor: pointer; }
  pre {
    white-space: pre-wrap; overflow-wrap: anywhere; background: var(--codigo);
    padding: 8px 10px; border-radius: 8px; font-size: 12.5px; margin: 6px 0 0;
  }
  .erro { color: var(--destaque); }
  .vazio { color: var(--suave); margin-top: 24px; text-align: center; }
  .modos { display: inline-flex; border: 1px solid var(--borda); border-radius: 999px; padding: 3px; background: var(--cartao); margin-bottom: 4px; }
  .modos button { border: 0; border-radius: 999px; padding: 6px 16px; color: var(--suave); background: transparent; }
  .modos button.ativo { background: var(--texto); color: var(--fundo); }
  body.modo-resposta .so-busca { display: none; }
  .resposta { max-width: 760px; margin: 24px auto 0; display: grid; gap: 12px; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 16px 18px; }
  .texto p { margin: 0 0 10px; } .texto p:last-child { margin-bottom: 0; }
  .texto ul, .texto ol { margin: 0 0 10px; padding-left: 20px; display: block; }
  .texto li { background: none; border: 0; padding: 2px 0; }
  .texto code { background: var(--codigo); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .texto pre code { padding: 0; background: none; }
  .texto pre { margin: 0 0 10px; }
  .cit { color: var(--destaque); text-decoration: none; font-weight: 600; font-size: 13px; }
  .cit-ruim { color: var(--fundo); background: var(--destaque); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .cursor::after { content: "▍"; color: var(--suave); animation: pisca 1s steps(1) infinite; }
  @keyframes pisca { 50% { opacity: 0; } }
  .selo { font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--borda); }
  .selo.ok { color: var(--ok); } .selo.alerta { color: var(--destaque); }
  .fontes h3 { font-size: 13px; color: var(--suave); font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .fontes li.citada { border-color: var(--destaque); }
  .fontes .tag { font-size: 11px; color: var(--destaque); margin-left: auto; white-space: nowrap; }
</style>
</head>
<body class="inicial modo-resposta">
<main>
  <div class="cabeca">
  <h1>RAG local sobre a documentação do Laravel</h1>
  <p class="sub">Pergunte em português; a resposta vem da documentação em inglês, com a seção citada (pgvector, pg_trgm e Ollama).</p>

  <form id="form">
    <div><div class="modos" role="tablist">
      <button type="button" data-modo="resposta" class="ativo">Resposta</button>
      <button type="button" data-modo="busca">Só busca</button>
    </div></div>
    <div class="linha">
      <input type="search" id="q" placeholder="Ex.: como excluir um registro sem apagá-lo do banco?" autofocus>
      <button class="principal" type="submit" id="enviar">Perguntar</button>
    </div>
    <div class="linha so-busca">
      <select id="estrategia"></select>
      <select id="k">
        <option value="3">top 3</option><option value="5" selected>top 5</option><option value="10">top 10</option>
      </select>
      <label class="check"><input type="checkbox" id="comparar"> comparar estratégias lado a lado</label>
    </div>
    <div class="exemplos" id="exemplos"></div>
  </form>
  </div>

  <div id="saida"></div>
</main>

<script>
const EXEMPLOS = [
  "Como excluir um registro sem apagá-lo de verdade do banco?",
  "Para que serve o método simplePaginate?",
  "Como evitar o problema de N+1 consultas?",
  "Como usar Cache::lock entre processos?",
  "Como gerar um link temporário para baixar um arquivo privado?",
];
const COMPARAR = ["vetorial-nomic", "vetorial-bge", "trigramas", "hibrida-bge-t0.2"];
const $ = (id) => document.getElementById(id);
let rotulos = {};
let modo = "resposta";
let pedidoAtual = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function carregarEstrategias() {
  const lista = await (await fetch("/api/estrategias")).json();
  for (const e of lista) {
    rotulos[e.id] = e.rotulo;
    $("estrategia").insertAdjacentHTML("beforeend", `<option value="${esc(e.id)}">${esc(e.rotulo)}</option>`);
  }
}

function trocarModo(novo) {
  modo = novo;
  document.body.classList.toggle("modo-resposta", modo === "resposta");
  for (const b of document.querySelectorAll(".modos button")) b.classList.toggle("ativo", b.dataset.modo === modo);
  $("enviar").textContent = modo === "resposta" ? "Perguntar" : "Buscar";
  if ($("q").value.trim()) enviar();
}

/* ---------- modo busca ---------- */

function colunaHTML(dados) {
  if (dados.erro) return `<section class="coluna"><h2>${esc(rotulos[dados.estrategia] || "")}</h2><p class="erro">${esc(dados.erro)}</p></section>`;
  const itens = dados.resultados.map((r, i) => `
    <li>
      <div class="topo"><span class="pos">${i + 1}.</span><span class="caminho">${esc(r.caminho)}</span></div>
      <div class="meta"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.secao)}</a> · ${r.pontuacao.toFixed(4)}</div>
      <details><summary>ver trecho</summary><pre>${esc(r.trecho)}</pre></details>
    </li>`).join("");
  return `<section class="coluna"><h2>${esc(dados.rotulo)} <span>${dados.ms} ms</span></h2><ol>${itens}</ol></section>`;
}

async function buscarUma(q, estrategia, k) {
  const params = new URLSearchParams({ q, estrategia, k });
  try {
    const resp = await fetch(`/api/buscar?${params}`);
    const dados = await resp.json();
    return resp.ok ? dados : { estrategia, erro: dados.erro || `erro ${resp.status}` };
  } catch (e) {
    return { estrategia, erro: "servidor fora do ar?" };
  }
}

async function buscar(q) {
  const estrategias = $("comparar").checked ? COMPARAR : [$("estrategia").value];
  $("saida").innerHTML = `<p class="vazio">Buscando…</p>`;
  const resultados = await Promise.all(estrategias.map((e) => buscarUma(q, e, $("k").value)));
  $("saida").innerHTML = `<div class="colunas${resultados.length === 1 ? " uma" : ""}">${resultados.map(colunaHTML).join("")}</div>`;
}

/* ---------- modo resposta ---------- */

// Markdown mínimo: blocos de código, `código`, **negrito**, listas e citações [n] viram links.
function inline(texto, total) {
  return esc(texto)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, grupo) => grupo.split(",").map((n) => {
      n = Number(n);
      return n >= 1 && n <= total
        ? `<a class="cit" href="#fonte-${n}">[${n}]</a>`
        : `<span class="cit-ruim" title="essa fonte não existe">[${n}]</span>`;
    }).join(""));
}

function markdown(texto, total) {
  const partes = texto.split("```");
  return partes.map((parte, i) => {
    if (i % 2 === 1) return `<pre><code>${esc(parte.replace(/^[a-z]*\n/, ""))}</code></pre>`;
    return parte.split(/\n{2,}/).filter((b) => b.trim()).map((bloco) => {
      const linhas = bloco.trim().split("\n");
      if (linhas.every((l) => /^\s*([-*]|\d+\.)\s/.test(l))) {
        const tag = /^\s*\d+\./.test(linhas[0]) ? "ol" : "ul";
        return `<${tag}>${linhas.map((l) => `<li>${inline(l.replace(/^\s*([-*]|\d+\.)\s/, ""), total)}</li>`).join("")}</${tag}>`;
      }
      return `<p>${linhas.map((l) => inline(l, total)).join("<br>")}</p>`;
    }).join("");
  }).join("");
}

function fontesHTML(fontes, citadas) {
  const itens = fontes.map((f) => `
    <li id="fonte-${f.numero}" class="${citadas.includes(f.numero) ? "citada" : ""}">
      <div class="topo"><span class="pos">[${f.numero}]</span><span class="caminho">${esc(f.caminho)}</span>
        ${citadas.includes(f.numero) ? '<span class="tag">citada</span>' : ""}</div>
      <div class="meta"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.secao)}</a></div>
      <details><summary>ver trecho</summary><pre>${esc(f.texto)}</pre></details>
    </li>`).join("");
  return `<div class="fontes"><h3>Fontes usadas</h3><ol>${itens}</ol></div>`;
}

function seloHTML(v, ms) {
  const tempo = `${(ms / 1000).toFixed(1)} s`;
  if (v.recusou) return `<div class="selo alerta">O modelo não encontrou a resposta nas fontes. (${tempo})</div>`;
  const avisos = [];
  if (v.invalidas.length) avisos.push(`cita fonte que não existe: ${v.invalidas.map((n) => `[${n}]`).join(", ")}`);
  if (v.sem_citacao) avisos.push("a resposta não cita nenhuma fonte");
  if (avisos.length) return `<div class="selo alerta">Atenção: ${avisos.join("; ")}. (${tempo})</div>`;
  const n = v.citadas.length;
  return `<div class="selo ok">✓ ${n} ${n === 1 ? "fonte citada" : "fontes citadas"}, todas conferidas entre os trechos encontrados. (${tempo})</div>`;
}

async function perguntar(q) {
  const controle = new AbortController();
  pedidoAtual = controle;
  const inicio = performance.now();
  $("saida").innerHTML = `<div class="resposta"><div class="cartao texto cursor" id="texto"><span class="vazio">Buscando trechos…</span></div><div id="selo"></div><div id="fontes"></div></div>`;
  let fontes = [], texto = "";
  const desenhar = (final) => {
    $("texto").innerHTML = texto ? markdown(texto, fontes.length) : `<span class="vazio">Gerando a resposta…</span>`;
    $("texto").classList.toggle("cursor", !final);
  };
  try {
    const resp = await fetch(`/api/perguntar?${new URLSearchParams({ q })}`, { signal: controle.signal });
    if (!resp.ok) throw new Error((await resp.json()).erro || `erro ${resp.status}`);
    const leitor = resp.body.getReader();
    const decodificador = new TextDecoder();
    let sobra = "";
    while (true) {
      const { value, done } = await leitor.read();
      if (done) break;
      sobra += decodificador.decode(value, { stream: true });
      const linhas = sobra.split("\n");
      sobra = linhas.pop();
      for (const linha of linhas) {
        if (!linha.trim()) continue;
        const ev = JSON.parse(linha);
        if (ev.tipo === "fontes") { fontes = ev.fontes; $("fontes").innerHTML = fontesHTML(fontes, []); desenhar(false); }
        else if (ev.tipo === "texto") { texto += ev.texto; desenhar(false); }
        else if (ev.tipo === "fim") {
          desenhar(true);
          $("selo").innerHTML = seloHTML(ev.verificacao, performance.now() - inicio);
          $("fontes").innerHTML = fontesHTML(fontes, ev.verificacao.citadas);
        } else if (ev.tipo === "erro") throw new Error(ev.erro);
      }
    }
  } catch (e) {
    if (e.name === "AbortError") return;
    $("texto").classList.remove("cursor");
    $("selo").innerHTML = `<div class="selo alerta">Erro: ${esc(e.message)}</div>`;
  }
}

/* ---------- geral ---------- */

function enviar() {
  const q = $("q").value.trim();
  if (!q) return;
  if (pedidoAtual) pedidoAtual.abort();
  document.body.classList.remove("inicial");
  sincronizarURL();
  return modo === "resposta" ? perguntar(q) : buscar(q);
}

// O estado fica na URL (?q=...&modo=busca&comparar=1...): dá para compartilhar ou recarregar.
function sincronizarURL() {
  const p = new URLSearchParams({ q: $("q").value.trim() });
  if (modo === "busca") {
    p.set("modo", "busca");
    p.set("k", $("k").value);
    if ($("comparar").checked) p.set("comparar", "1"); else p.set("estrategia", $("estrategia").value);
  }
  history.replaceState(null, "", `?${p}`);
}

$("form").addEventListener("submit", (ev) => { ev.preventDefault(); enviar(); });
$("comparar").addEventListener("change", () => { $("estrategia").disabled = $("comparar").checked; if ($("q").value.trim()) enviar(); });
for (const b of document.querySelectorAll(".modos button")) b.onclick = () => trocarModo(b.dataset.modo);
for (const ex of EXEMPLOS) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = ex;
  b.onclick = () => { $("q").value = ex; enviar(); };
  $("exemplos").appendChild(b);
}

async function iniciar() {
  await carregarEstrategias();
  const p = new URLSearchParams(location.search);
  if (p.get("estrategia") && rotulos[p.get("estrategia")]) $("estrategia").value = p.get("estrategia");
  if (p.get("k")) $("k").value = p.get("k");
  if (p.get("comparar") === "1") { $("comparar").checked = true; $("estrategia").disabled = true; }
  // Links antigos (?comparar=1 ou ?estrategia=...) continuam abrindo no modo busca.
  const novoModo = p.get("modo") || (p.get("comparar") || p.get("estrategia") ? "busca" : "resposta");
  if (p.get("q")) $("q").value = p.get("q");
  trocarModo(novoModo);
}
iniciar();
</script>
</body>
</html>
