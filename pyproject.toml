[project]
name = "rag-laravel-docs"
version = "0.1.0"
description = "RAG local sobre a documentação do Laravel: busca vetorial e híbrida no PostgreSQL (pgvector + pg_trgm), com avaliação."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
