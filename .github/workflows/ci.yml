name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Testes (pytest)
        run: uv run pytest -q
